[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onshape-mcp"
version = "0.9.0"
description = "Parametric CAD with an AI, built so a person can keep editing the result"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []       # the core runs on the standard library alone
keywords = ["cad", "parametric", "onshape", "mcp", "model-context-protocol", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.urls]
Homepage = "https://github.com/bogdanr/onshape-mcp"
Issues = "https://github.com/bogdanr/onshape-mcp/issues"

[project.scripts]
onshape-mcp = "onshape_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onshape_mcp = ["guides/*.md"]

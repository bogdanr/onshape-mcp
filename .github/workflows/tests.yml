name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The core needs nothing. Pillow draws the pictures; numpy and scipy run the motion sweep.
      - run: pip install . pillow numpy scipy
      - run: onshape-mcp --version && onshape-mcp guide agent-quickstart | head -3
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
